name: Maintenance report

on:
  # Every day at 12:00 UTC.
  schedule:
    - cron: "0 12 * * *"
  # Allow running it by hand from the Actions tab.
  workflow_dispatch:

# Needed so the workflow can commit the regenerated report back to the repo.
permissions:
  contents: write

# Don't let a manual run and the scheduled run stomp on each other.
concurrency:
  group: maintenance-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # NOTE: eleventy-fetch's disk cache is deliberately NOT persisted between
      # runs. At a daily cadence every entry is older than `cacheDuration`, so it
      # saved no API calls — but on a fetch failure eleventy-fetch silently falls
      # back to the expired entry, which once published a report containing a repo
      # that had been archived two days earlier. Starting cold each run means CI
      # always sees current data, and an API failure surfaces as a failed run
      # instead of a quietly-stale committed report.
      - name: Generate maintenance report
        env:
          # The built-in token reads public data across GitHub fine. Swap in a
          # PAT via a repo secret if you need private/org visibility or a higher
          # rate limit: MAINTENANCE_GH_TOKEN takes precedence when present.
          GITHUB_TOKEN: ${{ secrets.MAINTENANCE_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: node index.js

      - name: Commit report if changed
        run: |
          git config user.name "zachleat"
          git config user.email "zachleat@users.noreply.github.com"
          git add docs/report.json docs/report-sparklines.json docs/report-sparkline-aggregate.json
          git diff --staged --quiet || (git commit -m "update maintenance report" && git push)
