<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- GitHub Pages has no server-side redirects; use a client-side meta refresh.
         The URL is relative so it works whether Pages serves this folder as the
         site root (/docs source) or under a /docs/ path (branch-root source). -->
    <meta http-equiv="refresh" content="0; url=./report.json" />
    <link rel="canonical" href="./report.json" />
    <title>Maintenance report</title>
  </head>
  <body>
    <p>
      Redirecting to
      <a href="./report.json">report.json</a>…
    </p>
  </body>
</html>
